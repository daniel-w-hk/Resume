date = "2025.10–2026.05"
content = """
- 延續省級 SRTP 的整體研究方向，以個人本科論文聚焦靜態、點到點的單無人機航跡規劃。
- 將任務建模為受約束序列決策問題，設計十種離散機動與精簡的局部狀態表徵。
- 實作 Dueling Double DQN，包括價值／優勢雙分支、在線／目標網絡、經驗回放、Huber loss、梯度裁剪及邊界動作遮罩。
- 在 100 組地圖衍生仿真任務中與 A* 參考方法比較路徑長度、事後計算能耗與推理時間，並將結論限定於靜態仿真環境。
"""
