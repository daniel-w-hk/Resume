[[items]]
title = "D3QN-Based Single-UAV Path Planning in Layered Grid Environments"
subtitle = "Undergraduate Thesis · Southeast University"
date = "Oct 2025–May 2026"
content = """
- Developed an individual thesis from the broader SRTP research line, focusing on static point-to-point planning for a single UAV.
- Formulated the task as a constrained sequential decision problem with ten discrete manoeuvres and a compact local-state representation.
- Implemented Dueling Double DQN with value/advantage streams, online and target networks, experience replay, Huber loss, gradient clipping and boundary-aware action masking.
- Benchmarked the policy against an A* reference across 100 map-derived simulation tasks, comparing path length, post-computed energy and inference time within a static simulation setting.
"""
tags = ["Deep Reinforcement Learning", "D3QN", "Action Masking", "A* Benchmark"]

